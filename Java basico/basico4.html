<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Porcentagem do IPI</title>
</head>
    <script>

        let valor_un1_1 = 30 
        let valor_qu1_1 = 2 

        let valor_un2_2 = 40 
        let valorQu2_2 = 4 
    
        let ipi = 10
        let valor_total = (valor_un1_1 * valor_qu1_1 + valor_un2_2 * valorQu2_2)*(ipi/100 + 1);
         
        document.write("O valor total é igual à " + valor_total .toFixed(1));

    </script>
</body>
</html>
